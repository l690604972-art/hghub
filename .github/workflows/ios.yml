name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    tags: ["v*"]

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"

jobs:
  ios:
    name: iOS (unsigned IPA)
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 版本号对齐 tag
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          node -e "const fs=require('fs');for(const p of ['src-tauri/tauri.conf.json','package.json']){const j=JSON.parse(fs.readFileSync(p));j.version=process.argv[1];fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n')}" "$V"

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ios

      - name: 安装 XcodeGen（如缺失）
        run: which xcodegen || brew install xcodegen

      - name: 安装前端依赖与构建前端产物
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: 编译 Rust iOS 静态库 (aarch64-apple-ios)
        run: |
          cargo build --manifest-path src-tauri/Cargo.toml --target aarch64-apple-ios --release
          ls -lh src-tauri/target/aarch64-apple-ios/release/*.a

      - name: 初始化 Tauri iOS 工程并注入静态库与图标
        run: |
          set -euo pipefail
          pnpm tauri ios init --ci
          node scripts/sync-android-icons.mjs

          mkdir -p src-tauri/gen/apple/Externals/arm64/Release
          cp src-tauri/target/aarch64-apple-ios/release/libhuangguo_client_lib.a \
             src-tauri/gen/apple/Externals/arm64/Release/libapp.a

          # 将 project.yml 中的 Build Rust Code 脚本替换为跳过（静态库已由上一步编译并就位）
          node -e '
            const fs = require("fs");
            const p = "src-tauri/gen/apple/project.yml";
            let yml = fs.readFileSync(p, "utf8");
            yml = yml.replace(/script:\s*[^\n]+xcode-script[^\n]*/g, "script: echo \"Rust staticlib already built\"");
            fs.writeFileSync(p, yml);
            console.log("Updated project.yml:");
            console.log(yml);
          '
          (cd src-tauri/gen/apple && xcodegen generate)

          for PLIST in $(find src-tauri/gen/apple -name "Info.plist"); do
            echo "Patching $PLIST"
            /usr/libexec/PlistBuddy -c "Delete :NSAppTransportSecurity" "$PLIST" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" "$PLIST"
            /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true" "$PLIST"
            /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsLocalNetworking bool true" "$PLIST"
          done

      - name: 编译 iOS Release .app（免证书无签名）
        run: |
          set -o pipefail
          XCODEPROJ=$(find src-tauri/gen/apple -maxdepth 2 -name "*.xcodeproj" | head -n 1)
          SCHEME=$(xcodebuild -project "$XCODEPROJ" -list -json | node -e "const d=JSON.parse(require('fs').readFileSync(0,'utf8'));const s=d.project.schemes;console.log(s.find(x=>x.endsWith('_iOS'))||s[0]);")
          echo "Project=$XCODEPROJ Scheme=$SCHEME"
          if ! xcodebuild -project "$XCODEPROJ" \
            -scheme "$SCHEME" \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -configuration Release \
            -derivedDataPath src-tauri/gen/apple/build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            build > xcodebuild.log 2>&1; then
            ERR_SUMMARY=$(grep -E "error:|fatal|ld:|archive|Library not found|Undefined" xcodebuild.log | tail -n 25 | tr '\n' ' ')
            tail -n 80 xcodebuild.log
            echo "::error title=xcodebuild failed::${ERR_SUMMARY:-$(tail -n 15 xcodebuild.log | tr '\n' ' ')}"
            exit 1
          fi

      - name: 打包 IPA（含 Ad-hoc 签名，兼容自签工具与 TrollStore）
        run: |
          set -euo pipefail
          V="${{ steps.ver.outputs.version }}"
          APP_PATH=$(find src-tauri/gen/apple/build/Build/Products -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "::error::未找到编译产出的 .app"
            exit 1
          fi
          echo "Packaging $APP_PATH"
          rm -rf Payload artifacts
          mkdir -p Payload artifacts
          cp -R "$APP_PATH" Payload/
          APP_BUNDLE=$(find Payload -maxdepth 1 -name "*.app" -type d | head -n 1)
          if [ -f "$APP_BUNDLE/Info.plist" ]; then
            /usr/libexec/PlistBuddy -c "Delete :NSAppTransportSecurity" "$APP_BUNDLE/Info.plist" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" "$APP_BUNDLE/Info.plist" || true
            /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true" "$APP_BUNDLE/Info.plist" || true
            /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsLocalNetworking bool true" "$APP_BUNDLE/Info.plist" || true
          fi
          codesign --force --deep --sign - "$APP_BUNDLE"
          zip -r9 "artifacts/HGhub_${V}_ios_unsigned.ipa" Payload
          ls -lh artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: HGhub-iOS-IPA
          path: artifacts/*.ipa
          if-no-files-found: error

      - name: 发布到 GitHub Releases (ios-latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-latest
          name: "HGhub v${{ steps.ver.outputs.version }} (iOS Unsigned IPA)"
          body: |
            自动构建的 iOS 免证书未签名 IPA（已做 Ad-hoc 签名，兼容 Sideloadly / AltStore / 爱思助手 / TrollStore）。
          files: artifacts/*.ipa
          prerelease: false
          make_latest: true
