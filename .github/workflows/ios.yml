name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    tags: ["v*"]

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"

jobs:
  ios:
    name: iOS (unsigned IPA)
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 版本号对齐 tag
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          node -e "const fs=require('fs');for(const p of ['src-tauri/tauri.conf.json','package.json']){const j=JSON.parse(fs.readFileSync(p));j.version=process.argv[1];fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n')}" "$V"

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ios

      - name: 安装 XcodeGen（如缺失）
        run: |
          which xcodegen || brew install xcodegen

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      - name: 初始化 Tauri iOS 工程并同步图标
        run: |
          pnpm tauri ios init --ci
          node scripts/sync-android-icons.mjs

      - name: 配置 Info.plist 允许本地环回与 HTTP 请求
        run: |
          for PLIST in $(find src-tauri/gen/apple -name "Info.plist"); do
            echo "Patching $PLIST"
            /usr/libexec/PlistBuddy -c "Delete :NSAppTransportSecurity" "$PLIST" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" "$PLIST"
            /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true" "$PLIST"
            /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsLocalNetworking bool true" "$PLIST"
          done

      - name: 构建前端产物
        run: pnpm build

      - name: 编译 iOS Release .app（免证书无签名）
        run: |
          set -euo pipefail
          XCODEPROJ=$(find src-tauri/gen/apple -maxdepth 2 -name "*.xcodeproj" | head -n 1)
          echo "Found project: $XCODEPROJ"
          SCHEME=$(xcodebuild -project "$XCODEPROJ" -list -json | node -e "const d=JSON.parse(require('fs').readFileSync(0,'utf8'));const s=d.project.schemes;console.log(s.find(x=>x.endsWith('_iOS'))||s[0]);")
          echo "Using scheme: $SCHEME"
          xcodebuild -project "$XCODEPROJ" \
            -scheme "$SCHEME" \
            -sdk iphoneos \
            -configuration Release \
            -arch arm64 \
            -derivedDataPath src-tauri/gen/apple/build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build

      - name: 打包 IPA（含 Ad-hoc 签名，兼容自签工具与 TrollStore）
        run: |
          set -euo pipefail
          V="${{ steps.ver.outputs.version }}"
          APP_PATH=$(find src-tauri/gen/apple/build/Build/Products -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "::error::未找到编译产出的 .app"
            exit 1
          fi
          echo "Packaging $APP_PATH"
          rm -rf Payload artifacts
          mkdir -p Payload artifacts
          cp -R "$APP_PATH" Payload/
          APP_BUNDLE=$(find Payload -maxdepth 1 -name "*.app" -type d | head -n 1)
          if [ -f "$APP_BUNDLE/Info.plist" ]; then
            /usr/libexec/PlistBuddy -c "Delete :NSAppTransportSecurity" "$APP_BUNDLE/Info.plist" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" "$APP_BUNDLE/Info.plist"
            /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true" "$APP_BUNDLE/Info.plist"
            /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsLocalNetworking bool true" "$APP_BUNDLE/Info.plist"
          fi
          codesign --force --deep --sign - "$APP_BUNDLE"
          zip -r9 "artifacts/HGhub_${V}_ios_unsigned.ipa" Payload
          ls -lh artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: HGhub-iOS-IPA
          path: artifacts/*.ipa
          if-no-files-found: error

      - name: 发布到 GitHub Releases (ios-latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-latest
          name: "HGhub v${{ steps.ver.outputs.version }} (iOS Unsigned IPA)"
          body: |
            自动构建的 iOS 免证书未签名 IPA（已做 Ad-hoc 签名，兼容 Sideloadly / AltStore / 爱思助手 / TrollStore）。
          files: artifacts/*.ipa
          prerelease: false
          make_latest: true
