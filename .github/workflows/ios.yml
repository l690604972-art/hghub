name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    tags: ["v*"]

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"

jobs:
  ios:
    name: iOS (unsigned IPA)
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 版本号对齐 tag
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          node -e "const fs=require('fs');for(const p of ['src-tauri/tauri.conf.json','package.json']){const j=JSON.parse(fs.readFileSync(p));j.version=process.argv[1];fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n')}" "$V"

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ios
          cache-on-failure: true

      - name: 安装 XcodeGen（如缺失）
        run: which xcodegen || brew install xcodegen

      - name: 安装前端依赖与构建前端产物
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: 编译 Rust iOS 静态库 (aarch64-apple-ios)
        run: |
          cargo build --manifest-path src-tauri/Cargo.toml --target aarch64-apple-ios --release --features tauri/custom-protocol
          ls -lh src-tauri/target/aarch64-apple-ios/release/*.a

      - name: 初始化 Tauri iOS 工程并打包 IPA
        run: |
          set +e
          mkdir -p artifacts
          exec > >(tee -a artifacts/build-debug.log) 2>&1

          echo "=== 1. tauri ios init ==="
          pnpm tauri ios init --ci
          node scripts/sync-android-icons.mjs

          node -e '
            const fs = require("fs");
            const p = "src-tauri/gen/apple/project.yml";
            let yml = fs.readFileSync(p, "utf8");
            yml = yml.replace("options:\n", "options:\n  xcodeVersion: \"15.0\"\n");
            yml = yml.replace(/^\s*-\s*path:\s*huangguo-client_iOS\s*\n/m, "");
            yml = yml.replace(/^\s*-\s*path:\s*Externals\s*\n/m, "");
            yml = yml.replace(/script:\s*[^\n]+xcode-script[^\n]*/g, "script: echo \"Rust staticlib already built\"");
            fs.writeFileSync(p, yml);
            console.log("=== Patched project.yml ===");
            console.log(yml);
          '
          (cd src-tauri/gen/apple && xcodegen generate)
          sed -i '' 's/objectVersion = 77;/objectVersion = 56;/g' src-tauri/gen/apple/huangguo-client.xcodeproj/project.pbxproj

          mkdir -p src-tauri/gen/apple/Externals/arm64/release
          cp src-tauri/target/aarch64-apple-ios/release/libhuangguo_client_lib.a \
             src-tauri/gen/apple/Externals/arm64/release/libapp.a

          if ls -d /Applications/Xcode_16*.app >/dev/null 2>&1; then
            sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -n 1)"
          fi

          for PLIST in $(find src-tauri/gen/apple -name "Info.plist"); do
            echo "Patching $PLIST"
            /usr/libexec/PlistBuddy -c "Delete :NSAppTransportSecurity" "$PLIST" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" "$PLIST"
            /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true" "$PLIST"
            /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsLocalNetworking bool true" "$PLIST"
          done

          echo "=== Running xcodebuild ==="
          XCODEPROJ="src-tauri/gen/apple/huangguo-client.xcodeproj"
          SCHEME="huangguo-client_iOS"
          echo "Using Project=$XCODEPROJ Scheme=$SCHEME"

          xcodebuild -project "$XCODEPROJ" \
            -scheme "$SCHEME" \
            -sdk iphoneos \
            -configuration release \
            -derivedDataPath src-tauri/gen/apple/build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            build

          XCODE_RET=$?
          echo "xcodebuild exit code: $XCODE_RET"

          V="${{ steps.ver.outputs.version }}"
          APP_PATH=$(find src-tauri/gen/apple/build -name "*.app" -type d | head -n 1)
          if [ -n "$APP_PATH" ]; then
            echo "=== Packaging $APP_PATH ==="
            rm -rf Payload
            mkdir -p Payload
            cp -R "$APP_PATH" Payload/
            APP_BUNDLE=$(find Payload -maxdepth 1 -name "*.app" -type d | head -n 1)
            if [ -f "$APP_BUNDLE/Info.plist" ]; then
              /usr/libexec/PlistBuddy -c "Delete :NSAppTransportSecurity" "$APP_BUNDLE/Info.plist" 2>/dev/null || true
              /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" "$APP_BUNDLE/Info.plist" || true
              /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true" "$APP_BUNDLE/Info.plist" || true
              /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsLocalNetworking bool true" "$APP_BUNDLE/Info.plist" || true
            fi
            codesign --force --deep --sign - "$APP_BUNDLE"
            zip -r9 "artifacts/HGhub_${V}_ios_unsigned.ipa" Payload
            rm -f artifacts/build-debug.log
            ls -lh artifacts
            exit 0
          else
            echo "::error::未找到 .app，详见 Release 中的 build-debug.log"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: HGhub-iOS-IPA
          path: artifacts/*
          if-no-files-found: error

      - name: 发布到 GitHub Releases (ios-latest)
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-latest
          name: "HGhub v${{ steps.ver.outputs.version }} (iOS Unsigned IPA)"
          body: |
            自动构建的 iOS 免证书未签名 IPA（已做 Ad-hoc 签名，兼容 Sideloadly / AltStore / 爱思助手 / TrollStore）。
          files: artifacts/*
          prerelease: false
          make_latest: true
